<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - LocalFinder</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #4A90E2;
            --primary-green: #50C878;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        
        .settings-section {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .settings-section h5 {
            color: var(--primary-blue);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-store text-primary"></i> LocalFinder
            </a>
            <div class="d-flex align-items-center">
                <a href="user-dashboard.html" class="btn btn-outline-primary me-2">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-cog me-2"></i>Settings</h1>
            <p class="mb-0">Manage your account preferences</p>
        </div>
    </div>

    <!-- Content -->
    <div class="container mb-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                
                <!-- Account Settings -->
                <div class="settings-section">
                    <h5><i class="fas fa-user me-2"></i>Account Information</h5>
                    <form id="accountForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" readonly>
                        </div>
                        <a href="profile.html" class="btn btn-primary">
                            <i class="fas fa-edit me-2"></i>Edit Profile
                        </a>
                    </form>
                </div>

                <!-- Notification Settings -->
                <div class="settings-section">
                    <h5><i class="fas fa-bell me-2"></i>Notifications</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="emailNotifications" checked>
                        <label class="form-check-label" for="emailNotifications">
                            Email Notifications
                        </label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="bookingReminders" checked>
                        <label class="form-check-label" for="bookingReminders">
                            Booking Reminders
                        </label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="promotions">
                        <label class="form-check-label" for="promotions">
                            Promotional Emails
                        </label>
                    </div>
                </div>

                <!-- Privacy Settings -->
                <div class="settings-section">
                    <h5><i class="fas fa-lock me-2"></i>Privacy & Security</h5>
                    <div class="mb-3">
                        <button class="btn btn-outline-primary w-100 mb-2">
                            <i class="fas fa-key me-2"></i>Change Password
                        </button>
                        <button class="btn btn-outline-danger w-100">
                            <i class="fas fa-trash me-2"></i>Delete Account
                        </button>
                    </div>
                </div>

                <!-- Save Button -->
                <div class="text-end">
                    <button class="btn btn-success" onclick="saveSettings()">
                        <i class="fas fa-save me-2"></i>Save Settings
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!AuthManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            loadSettings();
        });
        
        function loadSettings() {
            const userData = AuthManager.getUserData();
            if (userData) {
                document.getElementById('fullName').value = userData.full_name || '';
                document.getElementById('email').value = userData.email || '';
                document.getElementById('phone').value = userData.phone || '';
            }
            
            // Load notification preferences
            const settings = JSON.parse(localStorage.getItem('userSettings') || '{}');
            document.getElementById('emailNotifications').checked = settings.emailNotifications !== false;
            document.getElementById('bookingReminders').checked = settings.bookingReminders !== false;
            document.getElementById('promotions').checked = settings.promotions || false;
        }
        
        function saveSettings() {
            const settings = {
                emailNotifications: document.getElementById('emailNotifications').checked,
                bookingReminders: document.getElementById('bookingReminders').checked,
                promotions: document.getElementById('promotions').checked
            };
            
            localStorage.setItem('userSettings', JSON.stringify(settings));
            alert('Settings saved successfully!');
        }
    </script>
</body>
</html>
