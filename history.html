<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - LocalFinder</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #4A90E2;
            --primary-green: #50C878;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        
        .history-item {
            border-left: 3px solid var(--primary-blue);
            transition: all 0.2s;
        }
        
        .history-item:hover {
            border-left-color: var(--primary-green);
            transform: translateX(5px);
        }
        
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #dee2e6;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-store text-primary"></i> LocalFinder
            </a>
            <div class="d-flex align-items-center">
                <a href="user-dashboard.html" class="btn btn-outline-primary me-2">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-history me-2"></i>My History</h1>
            <p class="mb-0">View your activity and past bookings</p>
        </div>
    </div>

    <!-- Content -->
    <div class="container mb-5">
        <div class="timeline" id="historyContainer">
            <!-- History will be loaded here -->
            <div class="text-center py-5">
                <i class="fas fa-history fa-4x text-muted mb-3"></i>
                <h4 class="text-muted">No history yet</h4>
                <p class="text-muted">Your activity will appear here</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!AuthManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            loadHistory();
        });
        
        function loadHistory() {
            const bookings = JSON.parse(localStorage.getItem('userBookings') || '[]');
            const container = document.getElementById('historyContainer');
            
            if (bookings.length === 0) return;
            
            // Sort by date, most recent first
            bookings.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
            
            container.innerHTML = bookings.map(booking => `
                <div class="card history-item mb-3">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <h6 class="mb-1">${booking.businessName || 'Service Provider'}</h6>
                                <small class="text-muted">${booking.serviceType || 'Service'}</small>
                            </div>
                            <div class="col-md-3">
                                <i class="far fa-calendar me-2"></i>
                                ${formatDate(booking.date)}
                            </div>
                            <div class="col-md-3">
                                <i class="far fa-clock me-2"></i>
                                ${booking.time || 'Not specified'}
                            </div>
                            <div class="col-md-3">
                                <span class="badge ${getStatusClass(booking.status)}">
                                    ${booking.status || 'Pending'}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'Not set';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        
        function getStatusClass(status) {
            const classes = {
                'Confirmed': 'bg-success',
                'Pending': 'bg-warning text-dark',
                'Completed': 'bg-info',
                'Cancelled': 'bg-danger'
            };
            return classes[status] || 'bg-secondary';
        }
    </script>
</body>
</html>
