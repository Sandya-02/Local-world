<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your Business - LocalFinder</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <!-- Shared CSS -->
        <link href="assets/css/styles.css" rel="stylesheet">
        <!-- Page Specific CSS -->
        <link href="assets/css/registration.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #4A90E2;
            --primary-green: #50C878;
            --light-gray: #F5F5F5;
        }

        .progress-bar {
            background-color: var(--primary-green);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .step-indicator {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: var(--light-gray);
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .step.active .step-indicator {
            background-color: var(--primary-blue);
            color: white;
        }

        .step.completed .step-indicator {
            background-color: var(--primary-green);
            color: white;
        }

        .image-upload-preview {
            width: 150px;
            height: 150px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .image-upload-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation (same as index.html) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <!-- ... existing navigation code ... -->
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Register Your Business</h2>
                        
                        <!-- Progress Bar -->
                        <div class="progress mb-4" style="height: 3px;">
                            <div class="progress-bar" role="progressbar" style="width: 25%"></div>
                        </div>

                        <!-- Steps Indicator -->
                        <div class="row mb-4 text-center">
                            <div class="col step active">
                                <div class="step-indicator">1</div>
                                <small>Basic Info</small>
                            </div>
                            <div class="col step">
                                <div class="step-indicator">2</div>
                                <small>Business Details</small>
                            </div>
                            <div class="col step">
                                <div class="step-indicator">3</div>
                                <small>Services</small>
                            </div>
                            <div class="col step">
                                <div class="step-indicator">4</div>
                                <small>Verification</small>
                            </div>
                        </div>

                        <!-- Registration Form -->
                        <form id="businessRegistration">
                            <!-- Step 1: Basic Information -->
                            <div class="form-section active" id="step1">
                                <div class="mb-3">
                                    <label class="form-label">Business Name</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Business Category</label>
                                    <select class="form-select" required>
                                        <option value="">Select a category</option>
                                        <option value="restaurant">Restaurant</option>
                                        <option value="retail">Retail</option>
                                        <option value="service">Professional Service</option>
                                        <!-- Add more options -->
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Contact Email</label>
                                    <input type="email" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Contact Phone</label>
                                    <input type="tel" class="form-control" required>
                                </div>
                            </div>

                            <!-- Step 2: Business Details -->
                            <div class="form-section" id="step2">
                                <div class="mb-3">
                                    <label class="form-label">Business Address</label>
                                    <input type="text" class="form-control" placeholder="Street Address" required>
                                </div>
                                <div class="row mb-3">
                                    <div class="col">
                                        <input type="text" class="form-control" placeholder="City" required>
                                    </div>
                                    <div class="col">
                                        <input type="text" class="form-control" placeholder="State" required>
                                    </div>
                                    <div class="col">
                                        <input type="text" class="form-control" placeholder="ZIP" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Business Description</label>
                                    <textarea class="form-control" rows="4" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Business Hours</label>
                                    <!-- Add business hours inputs -->
                                </div>
                            </div>

                            <!-- Step 3: Services -->
                            <div class="form-section" id="step3">
                                <div class="mb-3">
                                    <label class="form-label">Services Offered</label>
                                    <div id="servicesList">
                                        <div class="service-item mb-3">
                                            <div class="row">
                                                <div class="col">
                                                    <input type="text" class="form-control" placeholder="Service Name">
                                                </div>
                                                <div class="col">
                                                    <input type="text" class="form-control" placeholder="Price">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-outline-primary btn-sm mt-2">
                                        <i class="fas fa-plus"></i> Add Another Service
                                    </button>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Business Photos</label>
                                    <div class="row g-3">
                                        <div class="col-auto">
                                            <div class="image-upload-preview">
                                                <i class="fas fa-plus text-muted"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Step 4: Verification -->
                            <div class="form-section" id="step4">
                                <div class="mb-3">
                                    <label class="form-label">Business License Number</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tax ID</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" required>
                                        <label class="form-check-label">
                                            I agree to the Terms of Service and Privacy Policy
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Form Navigation -->
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-outline-primary" id="prevBtn" style="display: none;">
                                    <i class="fas fa-arrow-left"></i> Previous
                                </button>
                                <button type="button" class="btn btn-primary ms-auto" id="nextBtn">
                                    Next <i class="fas fa-arrow-right"></i>
                                </button>
                                <button type="submit" class="btn btn-success" id="submitBtn" style="display: none;">
                                    Submit Registration
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer (same as index.html) -->
    <footer class="bg-dark text-light py-4">
        <!-- ... existing footer code ... -->
    </footer>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Form Navigation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add form navigation logic here
            // Will handle step progression, validation, and form submission
        });
    </script>
</body>
</html>
