<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalFinder</title>
    
    <!-- Core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .form-signin {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }

        .form-signin .card {
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        .form-signin .card-header {
            background-color: #0d6efd;
            color: white;
            border-radius: 1rem 1rem 0 0;
            padding: 1.5rem;
        }

        .form-signin .form-floating {
            margin-bottom: 1rem;
        }

        .btn-login {
            padding: 0.75rem;
        }

        .error-message {
            display: none;
            color: #dc3545;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="form-signin">
        <div class="card">
            <div class="card-header text-center">
                <h1 class="h3 mb-0">LocalFinder</h1>
                <p class="mb-0">Please sign in</p>
            </div>
            <div class="card-body p-4">
                <div id="errorMessage" class="error-message text-center"></div>
                
                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <button class="w-100 btn btn-lg btn-primary btn-login" type="submit">
                        Sign in
                    </button>

                    <div class="text-center mt-3">
                        <p>Don't have an account? <a href="registration.html">Register here</a></p>
                        <p><a href="index.html">Back to Home</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Simple validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            // For testing purposes - hardcoded credentials
            // In real application, this should be replaced with API call
            if (email === 'test@example.com' && password === 'password123') {
                // Successful login
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                window.location.href = 'index.html';
            } else {
                showError('Invalid email or password');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            // Hide error after 3 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
