<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LocalFinder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Register for LocalFinder</h3>
                    </div>
                    <div class="card-body">
                        <form id="registrationForm">
                            <div class="mb-3">
                                <label for="userType" class="form-label">Register as</label>
                                <select class="form-control" id="userType" required>
                                    <option value="user">Customer</option>
                                    <option value="seller">Business Owner</option>
                                </select>
                            </div>

                            <!-- Basic Information -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" required>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="3" required></textarea>
                            </div>

                            <!-- Business Information (hidden by default) -->
                            <div id="businessSection" style="display: none;">
                                <h4 class="mt-4">Business Information</h4>
                                
                                <div class="mb-3">
                                    <label for="businessName" class="form-label">Business Name</label>
                                    <input type="text" class="form-control" id="businessName">
                                </div>

                                <div class="mb-3">
                                    <label for="businessType" class="form-label">Business Type</label>
                                    <select class="form-control" id="businessType">
                                        <option value="">Select Business Type</option>
                                        <option value="restaurant">Restaurant</option>
                                        <option value="healthcare">Healthcare</option>
                                        <option value="education">Education</option>
                                        <option value="home_service">Home Service</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="businessDescription" class="form-label">Business Description</label>
                                    <textarea class="form-control" id="businessDescription" rows="3"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="businessAddress" class="form-label">Business Address</label>
                                    <textarea class="form-control" id="businessAddress" rows="3"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="businessPhone" class="form-label">Business Phone</label>
                                    <input type="tel" class="form-control" id="businessPhone">
                                </div>

                                <div class="mb-3">
                                    <label for="businessEmail" class="form-label">Business Email</label>
                                    <input type="email" class="form-control" id="businessEmail">
                                </div>

                                <div class="mb-3">
                                    <label for="website" class="form-label">Website (Optional)</label>
                                    <input type="url" class="form-control" id="website">
                                </div>

                                <div class="mb-3">
                                    <label for="operatingHours" class="form-label">Operating Hours</label>
                                    <textarea class="form-control" id="operatingHours" rows="3"></textarea>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Register</button>
                                <a href="login.html" class="btn btn-outline-secondary">Already have an account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/register.js"></script>
</body>
</html>
